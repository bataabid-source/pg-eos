# PG-EOS · automated PR review (GM directive 2026-09-27 "نفذ الكل بنفسك").
# anthropics/claude-code-action reviews every pull request against CLAUDE.md and the doc 36 §5-4
# checklist and posts its findings as PR comments. The check fails on a FAIL verdict or on a missing
# verdict; merge still needs CI gates ①–⑥ green and the human review required by branch protection on main.
# Inert until the repository secret CLAUDE_CODE_OAUTH_TOKEN exists (Settings → Secrets → Actions; Pro/Max token from `claude setup-token`, GM option 2 of D-193).
name: Claude PR review

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    # Without the secret the job still starts (a job-level `if` cannot read secrets), so every step
    # is gated on it: no secret = four skipped steps and a green job, never a red check on each PR.
    env:
      HAS_REVIEW_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Record job start
        id: start
        if: ${{ env.HAS_REVIEW_TOKEN == 'true' }}
        run: echo "since=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: ${{ env.HAS_REVIEW_TOKEN == 'true' }}
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        if: ${{ env.HAS_REVIEW_TOKEN == 'true' }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are pg-reviewer for this pull request. Read CLAUDE.md first; every rule there is
            binding and is quoted, never softened. Review the diff against:
            - ARCHITECTURE: hexagonal module boundaries, withContext() for every db.* call, RLS,
              outbox in the same transaction, Idempotency-Key on every write endpoint.
            - AGENT CONSTRAINTS: no `any`, `@ts-ignore`, `eslint-disable`; XState for state
              transitions; i18n keys not embedded strings; no magic numbers; pino not console.log;
              injected clock/generator in domain/.
            - TESTING: RED-first evidence, no weakened test, property tests on invariants.
            - GIT: first line `type(WBS): description`, Review trailer on feat/fix, no secrets.
            - Doc 36 §5-4 ten-point review checklist; "minor" findings are still findings.

            The PR branch is already checked out in the current working directory.
            Use `gh pr comment` for one top-level verdict: PASS(<n> findings) or FAIL(<n> findings),
            each finding numbered with file:line and the rule it breaks.
            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) for
            each file-specific finding. Only post GitHub comments — no other output.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      - name: Verdict gate — review is red on FAIL or on a missing verdict
        if: ${{ env.HAS_REVIEW_TOKEN == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          SINCE: ${{ steps.start.outputs.since }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/issues/$PR/comments?per_page=100" --paginate --slurp > "$RUNNER_TEMP/review-comments.json"
          node scripts/review-verdict.mjs "$RUNNER_TEMP/review-comments.json" --since "$SINCE"
