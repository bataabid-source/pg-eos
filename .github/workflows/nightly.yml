# PG-EOS · nightly — CLAUDE.md · TESTING / doc 36 §4-3: Stryker mutation on domain/ (G16, ≥ 75 %),
# the full acceptance run (G15, S1–S20) once tests/scenarios exists, and apply.sh --recreate on an
# ephemeral database. Red here does not block a merge (CI does) but is reported every morning.
# Gate ⑦'s image build (linux/arm64) + amd64 compose smoke also runs here (moved from per-PR CI by X part 20, D-197).
name: Nightly

on:
  schedule:
    - cron: "17 0 * * *"   # 03:17 Asia/Kuwait
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

# Same token scope the image job had in ci.yml (checkout + gha cache only).
permissions:
  contents: read

jobs:
  mutation:
    name: "G16 mutation on domain/ (≥ 75 %) + G15 scenarios + recreate"
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pgeos
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C --lc-ctype=C.UTF-8"
          TZ: Asia/Kuwait
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pgeos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: pgeos
      PG_APP_USER: pgeos_app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Assert psql 16
        run: psql --version | grep -q ' 16\.'
      - name: Install Chrome for Puppeteer
        run: pnpm --filter @pg-eos/documents exec puppeteer browsers install chrome
      - name: Allow Chrome sandbox on the runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Assert stryker resolves inside a module (pnpm strict layout)
        run: cd modules/fleet && pnpm -s exec stryker --version
      - name: Apply schema on a fresh database (apply.sh --recreate)
        run: bash database/schema/apply.sh --recreate
      # One module at a time: every module's tests share the one database (same reason as CI's
      # --concurrency=1), and Stryker runs each module's vitest project many times.
      - name: G16 — Stryker on every module's domain/ (break at 75 %)
        run: pnpm -s mutation   # scripts/mutation-all.sh — one module per process, own timeout
      - name: G15 — doc 40 Part E scenarios S1–S20 (when the runner exists)
        run: |
          if node -e "process.exit(require('./package.json').scripts['test:scenarios'] ? 0 : 1)"; then
            pnpm exec turbo run build --filter=@pg-eos/scenarios... --output-logs=errors-only
            pnpm -s test:scenarios --reporter=list || true
            pnpm -s test:scenarios --reporter=json > "$RUNNER_TEMP/scenarios-report.json" 2>/dev/null || true
            # merge-gate semantics (green.json regressions fail); the strict 20/20 line is printed for the record
            node scripts/scenarios-verdict.mjs "$RUNNER_TEMP/scenarios-report.json" --strict || true
            node scripts/scenarios-verdict.mjs "$RUNNER_TEMP/scenarios-report.json"
          else
            echo "test:scenarios not present yet — G15 stays NOT RUNNABLE (docs/STREAMS.md §Enablement 3)"
          fi

  image:
    name: "⑦ build images (linux/arm64) + compose smoke"
    runs-on: ubuntu-24.04
    # QEMU-emulated arm64 install + build; no CI job had a timeout before (default recorded, X part 5c).
    timeout-minutes: 45
    env:
      # Every `docker compose` below reads this file (no -f needed).
      COMPOSE_FILE: infra/docker/docker-compose.yml
      # Worker log probe: WORKER_LOG_RETRIES attempts, WORKER_LOG_RETRY_SECONDS apart.
      WORKER_LOG_RETRIES: 30
      WORKER_LOG_RETRY_SECONDS: 2
      # Upper bound for `up --wait` on the api HEALTHCHECK.
      COMPOSE_WAIT_TIMEOUT_SECONDS: 180
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # doc 36 §4-3 ⑦: the images are built for linux/arm64 (Tier 0). Pushed nowhere; no registry login.
      - name: Build the image for linux/arm64 (push false)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max
      - name: Build the image for linux/amd64 and load it for the smoke run
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          load: true
          tags: pg-eos/app:local
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max
      # X part 6: the multi-stage image's size, printed so a later PR can compare (no earlier figure exists).
      - name: Image size (recorded)
        run: docker image inspect pg-eos/app:local --format '{{.Size}}' | numfmt --to=iec --suffix=B
      - name: Compose file is valid
        run: docker compose config -q
      - name: Start postgres
        run: docker compose up -d postgres
      - name: Apply the schema inside the image (doc 42 §8.1 shape, never --recreate)
        run: docker compose run --rm -e PGUSER=postgres api bash database/schema/apply.sh
      - name: Start api (waits on the api HEALTHCHECK)
        run: docker compose up -d --wait --wait-timeout "$COMPOSE_WAIT_TIMEOUT_SECONDS" --no-build api
      # Compose refuses --wait on a service without a healthcheck (worker: disable: true); the worker's
      # liveness is proven by the log grep and the `docker inspect … true 0` step below.
      - name: Start worker
        run: docker compose up -d --no-build worker
      - name: GET /health answers 200
        run: curl -fsS http://127.0.0.1:3000/health
      - name: The worker's relay loop started (bounded retry)
        run: |
          for _ in $(seq 1 "$WORKER_LOG_RETRIES"); do
            if docker compose logs worker | grep -q "relay loop starting"; then exit 0; fi
            sleep "$WORKER_LOG_RETRY_SECONDS"
          done
          docker compose logs worker
          exit 1
      # A crash-looping worker under restart: unless-stopped must fail here.
      - name: The worker is running and has not restarted
        run: test "$(docker inspect -f '{{.State.Running}} {{.RestartCount}}' pg-eos-worker)" = "true 0"
      - name: Compose logs (on failure)
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
