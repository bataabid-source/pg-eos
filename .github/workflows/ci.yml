# PG-EOS · CI — gates ①–⑥ (CLAUDE.md · DEPLOYMENT PIPELINE). Gate ⑦ (build images + migrations)
# is the deploy pipeline, not CI. WBS 0.6a part 2/2: CI and integration tests connect as
# pgeos_app (D-133, migration 0007), never as the postgres superuser, so RLS actually applies.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: "① lint + boundaries + typecheck"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm lint:boundaries
      - run: pnpm typecheck
      - name: Hooks and bookkeeping gates (lane-guard, commit-msg, check-locks, brief-check — D-179)
        run: bash tests/hooks/run.sh
      - name: LANE_LOCKS.md is valid (D-179)
        run: bash scripts/check-locks.sh tasks/LANE_LOCKS.md

  test:
    name: "②③ unit + integration (as pgeos_app)"
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pgeos
          POSTGRES_USER: postgres
          # Loopback service container, never reachable outside the job network — same posture as
          # infra/docker/docker-compose.yml (local dev). No password literal anywhere in this file.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C --lc-ctype=C.UTF-8"
          TZ: Asia/Kuwait  # parity with infra/docker/docker-compose.yml
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pgeos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: pgeos
      PG_APP_USER: pgeos_app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Runner pinned to ubuntu-24.04 (not the moving ubuntu-latest label): its image ships the
      # PostgreSQL 16 client that apply.sh needs. This step only asserts that, so an image change
      # fails loudly here instead of deep inside apply.sh.
      - name: Assert psql 16
        run: psql --version | grep -q ' 16\.'
      # packages/documents renders PDFs with Puppeteer. The pnpm store is restored from cache, so
      # puppeteer's postinstall (which downloads Chrome to ~/.cache/puppeteer) does not re-run:
      # install the pinned Chrome explicitly (CI run #1 failed with "Could not find Chrome").
      - name: Install Chrome for Puppeteer
        run: pnpm --filter @pg-eos/documents exec puppeteer browsers install chrome
      # ubuntu-24.04 restricts unprivileged user namespaces via AppArmor, which Chrome's sandbox
      # needs. Relaxed on the throwaway runner only — the app keeps the sandbox on (render.ts
      # launches without --no-sandbox).
      - name: Allow Chrome sandbox on the runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Apply schema (creates pgeos_app via migration 0007)
        run: bash database/schema/apply.sh --recreate
      # Default taken: gates ② (unit) and ③ (integration) share this one job because the
      # workspace's `pnpm test` (turbo run test) does not separate unit from integration test
      # tasks — a red in either blocks merge, same as running them as two jobs would. turbo's
      # `dependsOn: ["^build"]` on the test tasks builds dependencies first, so a separate build
      # step is not needed.
      # --concurrency=1: every package's tests share ONE database. In parallel,
      # modules/platform audit-chain-seq.test.ts (creates an audit_log partition — DDL,
      # AccessExclusiveLock) deadlocks (40P01) with another package's audit writes holding the
      # audit-chain advisory lock. Seen twice locally on 2026-09-24; serial runs are green.
      # --continue: run every package even after one fails, so a single red package does not hide
      # the others (run #1 stopped at @pg-eos/documents). The job still fails on any red.
      - run: pnpm exec turbo run test --concurrency=1 --continue

  acceptance:
    name: "④ acceptance (doc 40 Part E)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # doc 40 Part E: "All 20 (S1-S20) must pass before any production deploy" — a gate on the
      # deploy pipeline, not on every commit; each S# spans modules that are built lane by lane.
      # This job reports how many are implemented and trips the moment a scenario spec exists with
      # no Playwright runner wired (the point at which the runner must be added to this job).
      - name: Doc 40 Part E scenarios
        run: |
          n=$(find tests/scenarios -type f -name '*.spec.ts' | wc -l)
          echo "doc 40 Part E scenarios implemented: ${n} / 20 (S1-S20 gate production deploy)"
          if [ "$n" -gt 0 ]; then
            echo "::error::tests/scenarios has ${n} spec(s) but no Playwright runner is wired in this job yet" >&2
            exit 1
          fi

  guards:
    name: "⑤ guards (G1-G18)"
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pgeos
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C --lc-ctype=C.UTF-8"
          TZ: Asia/Kuwait  # parity with infra/docker/docker-compose.yml
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pgeos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: pgeos
      PG_APP_USER: pgeos_app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Assert psql 16
        run: psql --version | grep -q ' 16\.'
      - run: bash database/schema/apply.sh --recreate
      # G14 (test:isolation) connects as pgeos_app, per PG_APP_USER above.
      - run: pnpm guards:run

  security:
    name: "⑥ security scan"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (blocking)
        run: pnpm audit --audit-level=high
      - name: Gitleaks (blocking, honours .gitleaksignore)
        # safe.directory: the container user differs from the checkout owner; without it git
        # refuses the repo ("dubious ownership") and the scan would not run.
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            ghcr.io/gitleaks/gitleaks:v8.24.2 git /repo --redact
      - name: SBOM (SPDX JSON)
        uses: anchore/sbom-action@v0.17.9
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
