# PG-EOS · CI — gates ①–⑥ and gate ⑦'s image build (CLAUDE.md · DEPLOYMENT PIPELINE). Gate ⑦'s
# linux/arm64 image build and one amd64 compose smoke run live here (ADR-0006 consequence 1, X part
# 5c); applying migrations to a real environment and the deploy stay in the deploy pipeline
# (doc 42 §8.1). WBS 0.6a part 2/2: CI and integration tests connect as
# pgeos_app (D-133, migration 0007), never as the postgres superuser, so RLS actually applies.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: "① lint + boundaries + typecheck"
    runs-on: ubuntu-24.04
    steps:
      # fetch-depth: 0 — scripts/resolve-hashes.mjs runs `git blame` on docs/PROJECT_STATE.md,
      # tasks/MASTER_BACKLOG.md, tasks/LANE_LOCKS.md and docs/CHANGELOG.md to find each `<this
      # commit>` placeholder's introducing commit; a shallow checkout would blame lines onto the
      # synthetic grafted-history commit instead of their real one.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm lint:boundaries
      - run: pnpm typecheck
      - name: Hooks and bookkeeping gates (lane-guard, commit-msg, check-locks, brief-check — D-179)
        run: bash tests/hooks/run.sh
      - name: LANE_LOCKS.md is valid (D-179)
        run: bash scripts/check-locks.sh tasks/LANE_LOCKS.md
      - name: No stale `<this commit>` placeholders (P3, CLAUDE.md · GIT)
        run: node scripts/resolve-hashes.mjs --check

  test:
    name: "②③ unit + integration (as pgeos_app)"
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pgeos
          POSTGRES_USER: postgres
          # Loopback service container, never reachable outside the job network — same posture as
          # infra/docker/docker-compose.yml (local dev). No password literal anywhere in this file.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C --lc-ctype=C.UTF-8"
          TZ: Asia/Kuwait  # parity with infra/docker/docker-compose.yml
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pgeos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: pgeos
      PG_APP_USER: pgeos_app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Runner pinned to ubuntu-24.04 (not the moving ubuntu-latest label): its image ships the
      # PostgreSQL 16 client that apply.sh needs. This step only asserts that, so an image change
      # fails loudly here instead of deep inside apply.sh.
      - name: Assert psql 16
        run: psql --version | grep -q ' 16\.'
      # packages/documents renders PDFs with Puppeteer. The pnpm store is restored from cache, so
      # puppeteer's postinstall (which downloads Chrome to ~/.cache/puppeteer) does not re-run:
      # install the pinned Chrome explicitly (CI run #1 failed with "Could not find Chrome").
      - name: Install Chrome for Puppeteer
        run: pnpm --filter @pg-eos/documents exec puppeteer browsers install chrome
      # ubuntu-24.04 restricts unprivileged user namespaces via AppArmor, which Chrome's sandbox
      # needs. Relaxed on the throwaway runner only — the app keeps the sandbox on (render.ts
      # launches without --no-sandbox).
      - name: Allow Chrome sandbox on the runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Apply schema (creates pgeos_app via migration 0007)
        run: bash database/schema/apply.sh --recreate
      # The service container prints its whole server log when the job ends; with the default
      # log_min_messages every negative test's ERROR + STATEMENT lands there (~5,000 lines on
      # 2026-09-27), pushing the test runner's own output out of the reachable log tail. vitest
      # already prints every failing assertion, so the server log carries nothing CI needs.
      - name: Quiet the service container's error log (vitest reports the failures)
        run: psql -v ON_ERROR_STOP=1 -c "alter system set log_min_messages = 'fatal'" -c "alter system set log_min_error_statement = 'panic'" -c "select pg_reload_conf()"
      # Default taken: gates ② (unit) and ③ (integration) share this one job because the
      # workspace's `pnpm test` (turbo run test) does not separate unit from integration test
      # tasks — a red in either blocks merge, same as running them as two jobs would. turbo's
      # `dependsOn: ["^build"]` on the test tasks builds dependencies first, so a separate build
      # step is not needed.
      # --concurrency=1: every package's tests share ONE database. In parallel,
      # modules/platform audit-chain-seq.test.ts (creates an audit_log partition — DDL,
      # AccessExclusiveLock) deadlocks (40P01) with another package's audit writes holding the
      # audit-chain advisory lock. Seen twice locally on 2026-09-24; serial runs are green.
      # --continue: run every package even after one fails, so a single red package does not hide
      # the others (run #1 stopped at @pg-eos/documents). The job still fails on any red.
      - run: pnpm exec turbo run test --concurrency=1 --continue
      # X part 5c: tests/ops (compose / Dockerfile / ci.yml shape + scripts/set-role-passwords.sh).
      # Runs as PGUSER=postgres (job env) — the role-password scenario needs the superuser and
      # restores both roles' stored passwords itself.
      - run: pnpm test:ops

  acceptance:
    name: "④ acceptance (doc 40 Part E)"
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pgeos
          POSTGRES_USER: postgres
          # Loopback service container, never reachable outside the job network — same posture as
          # infra/docker/docker-compose.yml (local dev). No password literal anywhere in this file.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C --lc-ctype=C.UTF-8"
          TZ: Asia/Kuwait  # parity with infra/docker/docker-compose.yml
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pgeos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: pgeos
      PG_APP_USER: pgeos_app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Runner pinned to ubuntu-24.04 (not the moving ubuntu-latest label): its image ships the
      # PostgreSQL 16 client that apply.sh needs. This step only asserts that, so an image change
      # fails loudly here instead of deep inside apply.sh.
      - name: Assert psql 16
        run: psql --version | grep -q ' 16\.'
      - name: Apply schema (creates pgeos_app via migration 0007)
        run: bash database/schema/apply.sh --recreate
      - name: Quiet the service container's error log (Playwright reports the failures)
        run: psql -v ON_ERROR_STOP=1 -c "alter system set log_min_messages = 'fatal'" -c "alter system set log_min_error_statement = 'panic'" -c "select pg_reload_conf()"
      # doc 40 Part E: "All 20 (S1-S20) must pass before any production deploy" — a gate on the
      # deploy pipeline, not on every commit; each S# spans modules that are built lane by lane.
      # tests/scenarios' specs call the modules/wms (etc.) handlers in-process — no browser fixture
      # yet, so no Chrome/Puppeteer step here (added with the first PDA screen's browser leg).
      # Build @pg-eos/scenarios and its dependencies (modules/wms and the packages it needs) before
      # running it — the package itself has no `build` script, only its `dependencies` do.
      - name: Build @pg-eos/scenarios and its dependencies
        run: pnpm exec turbo run build --filter=@pg-eos/scenarios... --output-logs=errors-only
      # Playwright's own exit is not the gate: a scenario RED because its doc-38 rows are not built
      # yet is the build plan (docs/STREAMS.md §G15). scripts/scenarios-verdict.mjs fails the job only
      # when a scenario listed in tests/scenarios/green.json fails or goes missing (a regression);
      # deploy runs the same script with --strict (20/20).
      - name: Doc 40 Part E scenarios (S1-S20)
        run: |
          pnpm -s test:scenarios --reporter=list || true
          pnpm -s test:scenarios --reporter=json > "$RUNNER_TEMP/scenarios-report.json" 2>/dev/null || true
          node scripts/scenarios-verdict.mjs "$RUNNER_TEMP/scenarios-report.json"

  guards:
    name: "⑤ guards (G1-G18)"
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pgeos
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C --lc-ctype=C.UTF-8"
          TZ: Asia/Kuwait  # parity with infra/docker/docker-compose.yml
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pgeos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: pgeos
      PG_APP_USER: pgeos_app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Assert psql 16
        run: psql --version | grep -q ' 16\.'
      - run: bash database/schema/apply.sh --recreate
      # G15 needs @pg-eos/scenarios (and modules/wms, its dependency) built, or it reads as
      # "no playwright JSON report (did it run?)" instead of the real S1-S20 count.
      - name: Build @pg-eos/scenarios and its dependencies
        run: pnpm exec turbo run build --filter=@pg-eos/scenarios... --output-logs=errors-only
      # G14 (test:isolation) connects as pgeos_app, per PG_APP_USER above.
      # The service container prints its whole server log when the job ends; with the default
      # log_min_messages every negative test's ERROR + STATEMENT lands there (~5,000 lines on
      # 2026-09-27), pushing the test runner's own output out of the reachable log tail. vitest
      # already prints every failing assertion, so the server log carries nothing CI needs.
      - name: Quiet the service container's error log (vitest reports the failures)
        run: psql -v ON_ERROR_STOP=1 -c "alter system set log_min_messages = 'fatal'" -c "alter system set log_min_error_statement = 'panic'" -c "select pg_reload_conf()"
      - run: pnpm guards:run

  security:
    name: "⑥ security scan"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (blocking)
        run: pnpm audit --audit-level=high
      - name: Gitleaks (blocking, honours .gitleaksignore)
        # safe.directory: the container user differs from the checkout owner; without it git
        # refuses the repo ("dubious ownership") and the scan would not run.
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            ghcr.io/gitleaks/gitleaks:v8.24.2 git /repo --redact
      - name: SBOM (SPDX JSON)
        uses: anchore/sbom-action@v0.17.9
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

  image:
    name: "⑦ build images (linux/arm64) + compose smoke"
    runs-on: ubuntu-24.04
    # QEMU-emulated arm64 install + build; no CI job had a timeout before (default recorded, X part 5c).
    timeout-minutes: 45
    env:
      # Every `docker compose` below reads this file (no -f needed).
      COMPOSE_FILE: infra/docker/docker-compose.yml
      # Worker log probe: WORKER_LOG_RETRIES attempts, WORKER_LOG_RETRY_SECONDS apart.
      WORKER_LOG_RETRIES: 30
      WORKER_LOG_RETRY_SECONDS: 2
      # Upper bound for `up --wait` on the api HEALTHCHECK.
      COMPOSE_WAIT_TIMEOUT_SECONDS: 180
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # doc 36 §4-3 ⑦: the images are built for linux/arm64 (Tier 0). Pushed nowhere; no registry login.
      - name: Build the image for linux/arm64 (push false)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max
      - name: Build the image for linux/amd64 and load it for the smoke run
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          load: true
          tags: pg-eos/app:local
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max
      - name: Compose file is valid
        run: docker compose config -q
      - name: Start postgres
        run: docker compose up -d postgres
      - name: Apply the schema inside the image (doc 42 §8.1 shape, never --recreate)
        run: docker compose run --rm -e PGUSER=postgres api bash database/schema/apply.sh
      - name: Start api (waits on the api HEALTHCHECK)
        run: docker compose up -d --wait --wait-timeout "$COMPOSE_WAIT_TIMEOUT_SECONDS" --no-build api
      # Compose refuses --wait on a service without a healthcheck (worker: disable: true); the worker's
      # liveness is proven by the log grep and the `docker inspect … true 0` step below.
      - name: Start worker
        run: docker compose up -d --no-build worker
      - name: GET /health answers 200
        run: curl -fsS http://127.0.0.1:3000/health
      - name: The worker's relay loop started (bounded retry)
        run: |
          for _ in $(seq 1 "$WORKER_LOG_RETRIES"); do
            if docker compose logs worker | grep -q "relay loop starting"; then exit 0; fi
            sleep "$WORKER_LOG_RETRY_SECONDS"
          done
          docker compose logs worker
          exit 1
      # A crash-looping worker under restart: unless-stopped must fail here.
      - name: The worker is running and has not restarted
        run: test "$(docker inspect -f '{{.State.Running}} {{.RestartCount}}' pg-eos-worker)" = "true 0"
      - name: Compose logs (on failure)
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
